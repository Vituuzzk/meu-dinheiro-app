<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 Meu Dinheiro • MVP</title>
    <style>
        /* CSS básico incorporado para garantir que não falte */
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            padding: 16px 0 32px;
        }
        .app-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        header {
            text-align: center;
            margin-bottom: 8px;
        }
        header h1 { color: #1f2937; font-size: 28px; }
        #data-atual { color: #6b7280; }
        .card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e5e7eb;
        }
        .destaque {
            background: linear-gradient(145deg, #2563eb, #1e40af);
            color: white;
        }
        .destaque label { color: #bfdbfe; }
        .destaque input {
            background: rgba(255,255,255,0.15);
            border: 1px solid #60a5fa;
            color: white;
        }
        .destaque input::placeholder { color: #93c5fd; }
        input, select, button {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            border-radius: 16px;
            border: 1.5px solid #d1d5db;
            font-size: 16px;
            background: white;
        }
        button {
            background: #2563eb;
            color: white;
            font-weight: bold;
            border: none;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #1d4ed8; }
        .btn-perigo {
            background: #f3f4f6;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .btn-perigo:hover { background: #fee2e2; }
        .saldo-disponivel {
            margin-top: 20px;
            text-align: center;
        }
        .saldo-disponivel span { font-size: 14px; opacity: 0.9; }
        .saldo-disponivel h2 { font-size: 42px; margin-top: 8px; letter-spacing: -0.5px; }
        #lista-gastos {
            list-style: none;
            padding: 0;
            max-height: 250px;
            overflow-y: auto;
        }
        #lista-gastos li {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }
        canvas { max-height: 200px; margin-top: 16px; }
    </style>
    <!-- Chart.js de CDN confiável -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>💰 Meu Dinheiro</h1>
            <p id="data-atual"></p>
        </header>

        <!-- Card do Salário -->
        <div class="card destaque">
            <label>💵 Salário do Mês</label>
            <input type="number" id="salario-input" placeholder="R$ 0,00" step="0.01" value="">
            <button id="btn-salvar-salario">Salvar Salário</button>
            <div class="saldo-disponivel">
                <span>Disponível até o fim do mês:</span>
                <h2 id="saldo-disponivel-valor">R$ 0,00</h2>
            </div>
        </div>

        <!-- Formulário de Gasto -->
        <div class="card">
            <h3>➕ Novo Gasto</h3>
            <input type="number" id="valor-gasto" placeholder="Valor (R$)" step="0.01">
            <select id="categoria-gasto">
                <option value="Alimentação">🍔 Alimentação</option>
                <option value="Transporte">🚗 Transporte</option>
                <option value="Lazer">🎉 Lazer</option>
                <option value="Contas">📄 Contas</option>
                <option value="Outros">📦 Outros</option>
            </select>
            <input type="date" id="data-gasto">
            <button id="btn-adicionar">Adicionar Gasto</button>
        </div>

        <!-- Lista de gastos -->
        <div class="card">
            <h3>📋 Últimos Lançamentos</h3>
            <ul id="lista-gastos"></ul>
            <button id="btn-limpar" class="btn-perigo">🗑️ Limpar Todos os Dados</button>
        </div>

        <!-- Gráfico -->
        <div class="card">
            <h3>📊 Para onde foi o dinheiro?</h3>
            <canvas id="grafico-categorias"></canvas>
        </div>
    </div>

    <script>
        // SCRIPT COMPACTO E ROBUSTO - Versão 2.0
        (function(){
            "use strict";
            
            // --- Elementos da Tela ---
            const salarioInput = document.getElementById('salario-input');
            const btnSalvar = document.getElementById('btn-salvar-salario');
            const saldoH2 = document.getElementById('saldo-disponivel-valor');
            
            const valorInput = document.getElementById('valor-gasto');
            const categoriaSelect = document.getElementById('categoria-gasto');
            const dataInput = document.getElementById('data-gasto');
            const btnAdicionar = document.getElementById('btn-adicionar');
            const listaUl = document.getElementById('lista-gastos');
            const btnLimpar = document.getElementById('btn-limpar');
            const dataAtualP = document.getElementById('data-atual');
            
            const ctx = document.getElementById('grafico-categorias').getContext('2d');
            let chartInstance = null;

            // --- Estado da Aplicação ---
            let salario = 0;
            let gastos = [];

            // --- Funções Utilitárias ---
            function formatarMoeda(valor) {
                return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            }

            function carregarDados() {
                const salarioSalvo = localStorage.getItem('salario');
                salario = salarioSalvo ? parseFloat(salarioSalvo) : 0;
                
                const gastosSalvos = localStorage.getItem('gastos');
                gastos = gastosSalvos ? JSON.parse(gastosSalvos) : [];
                
                // Atualiza campo de salário
                salarioInput.value = salario || '';
            }

            function salvarDados() {
                localStorage.setItem('salario', salario);
                localStorage.setItem('gastos', JSON.stringify(gastos));
            }

            function calcularTotalGastoMes() {
                const hoje = new Date();
                const mesAtual = hoje.getMonth();
                const anoAtual = hoje.getFullYear();
                
                return gastos.reduce((total, g) => {
                    const dataG = new Date(g.data + 'T00:00:00');
                    if (dataG.getMonth() === mesAtual && dataG.getFullYear() === anoAtual) {
                        return total + g.valor;
                    }
                    return total;
                }, 0);
            }

            function atualizarInterface() {
                // Saldo disponível
                const totalGasto = calcularTotalGastoMes();
                const disponivel = salario - totalGasto;
                saldoH2.textContent = formatarMoeda(disponivel);
                saldoH2.style.color = disponivel < 0 ? '#fca5a5' : 'white';
                
                // Lista de gastos (últimos 10)
                const ordenados = [...gastos].sort((a,b) => new Date(b.data) - new Date(a.data));
                listaUl.innerHTML = '';
                ordenados.slice(0,10).forEach(g => {
                    const li = document.createElement('li');
                    const dataFormatada = new Date(g.data + 'T00:00:00').toLocaleDateString('pt-BR');
                    li.innerHTML = `<span><strong>${g.categoria}</strong><br><small>${dataFormatada}</small></span>
                                    <span style="font-weight:bold;">${formatarMoeda(g.valor)}</span>`;
                    listaUl.appendChild(li);
                });
                
                // Gráfico (somente mês atual)
                const hoje = new Date();
                const mesAtual = hoje.getMonth();
                const anoAtual = hoje.getFullYear();
                const totais = {};
                gastos.forEach(g => {
                    const d = new Date(g.data + 'T00:00:00');
                    if (d.getMonth() === mesAtual && d.getFullYear() === anoAtual) {
                        totais[g.categoria] = (totais[g.categoria] || 0) + g.valor;
                    }
                });
                
                const labels = Object.keys(totais);
                const valores = Object.values(totais);
                
                if (chartInstance) chartInstance.destroy();
                chartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: valores,
                            backgroundColor: ['#f97316','#3b82f6','#10b981','#8b5cf6','#ec4899','#94a3b8']
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { position: 'bottom' } }
                    }
                });
                
                salvarDados();
            }

            function definirDataHoje() {
                const hoje = new Date();
                const ano = hoje.getFullYear();
                const mes = String(hoje.getMonth() + 1).padStart(2,'0');
                const dia = String(hoje.getDate()).padStart(2,'0');
                if (!dataInput.value) {
                    dataInput.value = `${ano}-${mes}-${dia}`;
                }
                dataAtualP.textContent = hoje.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
            }

            // --- Inicialização e Eventos ---
            function init() {
                carregarDados();
                definirDataHoje();
                atualizarInterface();
                
                btnSalvar.addEventListener('click', () => {
                    const val = parseFloat(salarioInput.value);
                    if (!isNaN(val) && val >= 0) {
                        salario = val;
                        atualizarInterface();
                    } else {
                        alert('Digite um valor válido para o salário.');
                    }
                });
                
                btnAdicionar.addEventListener('click', () => {
                    const valor = parseFloat(valorInput.value);
                    const categoria = categoriaSelect.value;
                    const data = dataInput.value;
                    
                    if (!data) { alert('Selecione uma data.'); return; }
                    if (isNaN(valor) || valor <= 0) { alert('Valor inválido.'); return; }
                    
                    gastos.push({ valor, categoria, data });
                    valorInput.value = '';
                    atualizarInterface();
                });
                
                btnLimpar.addEventListener('click', () => {
                    if (confirm('Apagar TODOS os dados?')) {
                        localStorage.clear();
                        salario = 0;
                        gastos = [];
                        salarioInput.value = '';
                        atualizarInterface();
                    }
                });
            }
            
            // Inicia tudo quando a página estiver pronta
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
