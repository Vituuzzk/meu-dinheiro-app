<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 Meu Dinheiro • Contas</title>
    <style>
        /* CSS mantido igual, apenas alguns ajustes novos */
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            padding: 16px 0 32px;
        }
        .app-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        header {
            text-align: center;
            margin-bottom: 8px;
            position: relative;
        }
        header h1 { color: #1f2937; font-size: 28px; }
        #data-atual { color: #6b7280; }
        .btn-gerenciar-contas {
            position: absolute;
            right: 0;
            top: 5px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            width: auto;
            margin: 0;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
            border: 1px solid #e5e7eb;
        }
        .destaque {
            background: linear-gradient(145deg, #2563eb, #1e40af);
            color: white;
        }
        .destaque label { color: #bfdbfe; }
        .destaque input, .destaque select {
            background: rgba(255,255,255,0.15);
            border: 1px solid #60a5fa;
            color: white;
        }
        .destaque input::placeholder { color: #93c5fd; }
        input, select, button {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            border-radius: 16px;
            border: 1.5px solid #d1d5db;
            font-size: 16px;
            background: white;
        }
        button {
            background: #2563eb;
            color: white;
            font-weight: bold;
            border: none;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background: #1d4ed8; }
        .btn-perigo {
            background: #f3f4f6;
            color: #dc2626;
            border: 1px solid #fecaca;
        }
        .btn-perigo:hover { background: #fee2e2; }
        .saldo-disponivel {
            margin-top: 20px;
            text-align: center;
        }
        .saldo-disponivel span { font-size: 14px; opacity: 0.9; }
        .saldo-disponivel h2 { font-size: 42px; margin-top: 8px; letter-spacing: -0.5px; }
        #lista-gastos {
            list-style: none;
            padding: 0;
            max-height: 250px;
            overflow-y: auto;
        }
        #lista-gastos li {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f3f4f6;
        }
        canvas { max-height: 200px; margin-top: 16px; }

        /* Estilos para gerenciamento de contas (modal simples) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            border-radius: 24px;
            padding: 24px;
            width: 90%;
            max-width: 400px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal h3 { margin-bottom: 16px; }
        .lista-contas { list-style: none; padding: 0; }
        .lista-contas li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }
        .conta-actions button {
            width: auto;
            padding: 4px 8px;
            margin: 0 2px;
            font-size: 14px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-container">
    <header>
        <h1>💰 Meu Dinheiro</h1>
        <p id="data-atual"></p>
        <button id="btn-gerenciar-contas" class="btn-gerenciar-contas" title="Gerenciar Contas">🏦</button>
    </header>

    <!-- Card de Saldo Total (soma dos saldos das contas incluídas) -->
    <div class="card destaque">
        <label>💵 Saldo Total Disponível</label>
        <h2 id="saldo-total-valor" style="font-size: 42px; margin: 8px 0;">R$ 0,00</h2>
        <p style="opacity:0.8; font-size:14px;">Soma das contas incluídas no total</p>
    </div>

    <!-- Formulário de Transação (por enquanto apenas Despesa) -->
    <div class="card">
        <h3>➕ Nova Despesa</h3>
        <select id="conta-transacao" required>
            <option value="">Selecione a conta...</option>
        </select>
        <input type="number" id="valor-gasto" placeholder="Valor (R$)" step="0.01">
        <select id="categoria-gasto">
            <option value="Alimentação">🍔 Alimentação</option>
            <option value="Transporte">🚗 Transporte</option>
            <option value="Lazer">🎉 Lazer</option>
            <option value="Contas">📄 Contas</option>
            <option value="Outros">📦 Outros</option>
        </select>
        <input type="date" id="data-gasto">
        <button id="btn-adicionar-despesa">Adicionar Despesa</button>
    </div>

    <!-- Lista de Últimas Transações -->
    <div class="card">
        <h3>📋 Últimos Lançamentos</h3>
        <ul id="lista-transacoes"></ul>
        <button id="btn-limpar-tudo" class="btn-perigo">🗑️ Limpar Todos os Dados</button>
    </div>

    <!-- Gráfico de Gastos por Categoria (ainda sem considerar conta) -->
    <div class="card">
        <h3>📊 Despesas por Categoria</h3>
        <canvas id="grafico-categorias"></canvas>
    </div>
</div>

<!-- Modal para Gerenciar Contas -->
<div class="modal-overlay" id="modal-contas">
    <div class="modal">
        <h3>🏦 Suas Contas</h3>
        <ul class="lista-contas" id="lista-contas-modal"></ul>
        <hr style="margin: 16px 0;">
        <h4>Nova Conta</h4>
        <input type="text" id="nova-conta-nome" placeholder="Nome (ex: Nubank)">
        <input type="number" id="nova-conta-saldo-inicial" placeholder="Saldo inicial (R$)" step="0.01" value="0">
        <label style="display: flex; align-items: center; gap: 8px; margin: 8px 0;">
            <input type="checkbox" id="nova-conta-incluir-total" checked style="width: auto; margin: 0;"> Incluir no Saldo Total
        </label>
        <button id="btn-criar-conta">Criar Conta</button>
        <button id="btn-fechar-modal" style="background:#9ca3af; margin-top:8px;">Fechar</button>
    </div>
</div>

<script>
    // O JavaScript será incluído aqui (próxima seção)
</script>
</body>
</html>
