<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 Meu Dinheiro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-theme.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/matheusmcuba/icones-bancos-brasileiros@1.1/dist/all.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-container">
    <!-- TELA PRINCIPAL -->
    <div id="tela-principal" class="tela ativa">
        <div class="cabecalho-ano">
            <button class="btn-ano-seta" id="ano-anterior">←</button>
            <h1 id="ano-atual-titulo">2026</h1>
            <button class="btn-ano-seta" id="ano-proximo">→</button>
            <button class="btn-dropdown-mes" id="btn-toggle-meses" style="margin-left: 8px;">▼</button>
        </div>
        <!-- Dropdown pop-up de meses -->
        <div class="meses-dropdown" id="meses-dropdown" style="display: none;">
            <div class="meses-grid" id="meses-grid">
                <button class="mes-chip" data-mes="0">JAN</button>
                <button class="mes-chip" data-mes="1">FEV</button>
                <button class="mes-chip" data-mes="2">MAR</button>
                <button class="mes-chip" data-mes="3">ABR</button>
                <button class="mes-chip" data-mes="4">MAI</button>
                <button class="mes-chip" data-mes="5">JUN</button>
                <button class="mes-chip" data-mes="6">JUL</button>
                <button class="mes-chip" data-mes="7">AGO</button>
                <button class="mes-chip" data-mes="8">SET</button>
                <button class="mes-chip" data-mes="9">OUT</button>
                <button class="mes-chip" data-mes="10">NOV</button>
                <button class="mes-chip" data-mes="11">DEZ</button>
            </div>
            <div class="meses-acoes">
                <button class="btn-acao" id="btn-cancelar-mes">Cancelar</button>
                <button class="btn-acao destaque" id="btn-mes-atual">Mês Atual</button>
            </div>
        </div>

        <!-- Restante da tela principal (igual) -->
        <div class="saldo-destaque">...</div>
        <div class="card">...</div>
        <!-- ... -->
    </div>
    <!-- ... resto do HTML ... -->
    <!-- ... resto das telas ... -->

    <!-- MODAL TRANSAÇÃO (com campo Descrição limpo) -->
    <div class="modal-overlay" id="modal-transacao">
        <div class="modal" style="max-width: 420px;">
            <!-- ... -->
            <label>Descrição</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="modal-descricao" placeholder="Ex: Compras do mês, Presente..." style="flex: 1;">
                <button type="button" id="btn-gravar-audio" class="btn-audio">🎤</button>
            </div>
            <!-- Categorias -->
            <label>Categoria</label>
            <div class="categorias-chips-container" id="categorias-chips-container"></div>
            <!-- ... -->
        </div>
    </div>

    <!-- Scripts -->
    <script src="exportar.js"></script>
    <script src="js/modules/mascaras.js"></script>
    <script src="js/modules/backup.js"></script>
    <script src="js/modules/categorias.js"></script>
    <script src="js/modules/ui.js"></script>
    <script src="app.js"></script>
</body>
</html>
