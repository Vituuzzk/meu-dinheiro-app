<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>💰 Meu Dinheiro - Teste</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dark-theme.css">
</head>
<body>
<div class="app-container">
    <!-- TELA PRINCIPAL -->
    <div id="tela-principal" class="tela ativa">
        <div class="cabecalho-ano">
            <button class="btn-ano-seta" id="mes-anterior-seta">←</button>
            <h1 id="mes-atual-titulo">Abril</h1>
            <button class="btn-ano-seta" id="mes-proximo-seta">→</button>
            <button class="btn-dropdown-mes" id="btn-toggle-meses">▼</button>
        </div>

        <div class="saldo-destaque">
            <div class="saldo-label">Saldo em contas</div>
            <div class="saldo-valor" id="saldo-total-valor">R$ 0,00</div>
        </div>

        <!-- SEÇÃO CONTAS (COM BOTÃO CORRIGIDO) -->
        <div class="card">
            <div class="card-header">
                <h3>Contas</h3>
                <div style="display: flex; gap: 12px;">
                    <a href="#" id="ver-todas-contas">Ver todas</a>
                    <a href="#" id="adicionar-conta-principal" style="font-size: 18px; font-weight: 700;">＋</a>
                </div>
            </div>
            <div id="lista-contas-resumo"></div>
        </div>

        <!-- BOTÃO FLUTUANTE (FAB) -->
        <button class="fab" id="fab-adicionar">+</button>
    </div>

    <!-- MENU INFERIOR -->
    <nav class="menu-inferior">
        <button class="menu-item ativo" data-tela="principal"><span>🏠</span>Principal</button>
        <button class="menu-item" data-tela="transacoes"><span>📋</span>Transações</button>
        <button class="menu-item" data-tela="investimentos"><span>📈</span>Investir</button>
        <button class="menu-item" data-tela="perfil"><span>👤</span>Perfil</button>
    </nav>
</div>

<!-- Script de diagnóstico -->
<script src="app.js"></script>
</body>
</html>
